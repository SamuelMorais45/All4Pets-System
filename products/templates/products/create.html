{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Produto</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <script>
        async function criarProduto(event) {
            event.preventDefault();
            const nome = document.getElementById("nome").value;
            const preco = parseFloat(document.getElementById("preco").value);
            const estoque = parseInt(document.getElementById("estoque").value);

            const response = await fetch("/api/products/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome, preco, estoque }),
            });

            if (response.ok) {
                alert("Produto criado com sucesso!");
                window.location.href = "/products/";
            } else {
                alert("Erro ao criar produto.");
            }
        }
    </script>
</head>
<body>
    <h1>Criar Produto</h1>
    <form onsubmit="criarProduto(event)">
        <label>Nome</label>
        <input id="nome" required>
        <label>Preço</label>
        <input id="preco" type="number" step="0.01" required>
        <label>Estoque</label>
        <input id="estoque" type="number" required>
        <button type="submit">Salvar</button>
    </form>
    <a href="/products/">⬅ Voltar</a>
</body>
</html>
